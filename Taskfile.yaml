# Local development of core. The kind cluster, registries, and base operators
# come from opendefence/base's taskfiles at BASE_REF; core adds its package,
# image, and Tilt loop on top. Other repositories include taskfiles/core.yaml.
version: "3"

# Base's taskfiles come from BASE_REF (default main); pin a commit with
# BASE_REF=<sha> together with a BASE_VERSION published from it.
vars:
  CLUSTER_NAME: '{{.CLUSTER_NAME | default "opendefence-dev"}}'
  KUBE_CONTEXT: '{{.KUBE_CONTEXT | default (printf "kind-%s" .CLUSTER_NAME)}}'

includes:
  registries:
    aliases: [r]
    taskfile: https://raw.githubusercontent.com/opendefence/base/{{.BASE_REF | default "main"}}/taskfiles/registries.yaml
    dir: "{{.ROOT_DIR}}"
  cluster:
    aliases: [c]
    taskfile: https://raw.githubusercontent.com/opendefence/base/{{.BASE_REF | default "main"}}/taskfiles/cluster.yaml
    dir: "{{.ROOT_DIR}}"
  base:
    taskfile: https://raw.githubusercontent.com/opendefence/base/{{.BASE_REF | default "main"}}/taskfiles/base.yaml
    dir: "{{.ROOT_DIR}}"
  core:
    taskfile: ./taskfiles/core.yaml
    dir: "{{.ROOT_DIR}}"
  build:
    taskfile: ./taskfiles/build.yaml
    dir: "{{.ROOT_DIR}}"
  ui:
    taskfile: ./taskfiles/ui.yaml
    dir: "{{.ROOT_DIR}}"

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  up:
    desc: Bring up core on the local cluster, creating the registries, cluster, and base first if missing
    cmds:
      - task: env
      - task: dev:ci

  env:
    desc: Start the registries and kind cluster, and install base unless it is installed
    cmds:
      - task: registries:up
      - task: cluster:create
      - task: registries:connect
      - task: cluster:configure-mirrors
      - task: cluster:document-local-registry
      - task: install-base

  install-base:
    internal: true
    # Both base's `task up` (zarf dev deploy) and base:install record the package
    # here; reinstall explicitly with `task base:install BASE_VERSION=...`
    status:
      - kubectl --context {{.KUBE_CONTEXT | shellQuote}} -n zarf get secret zarf-package-base
    cmds:
      # Base's taskfile derives BASE_PACKAGE from BASE_VERSION at file level,
      # before include or call vars apply, so pass them on a new command line.
      # The defaults stay inline: base's own empty defaults for these vars are
      # merged into this file's namespace and would shadow root-level ones.
      # `latest` is updated by base's publish workflow on every push to main.
      - >-
        {{.TASK_EXE}} base:install
        BASE_VERSION={{.BASE_VERSION | default "latest" | shellQuote}}
        BASE_ISSUER={{.BASE_ISSUER | default "ca" | shellQuote}}
        KUBE_CONTEXT={{.KUBE_CONTEXT | shellQuote}}

  down:
    desc: Delete the kind cluster and leave the registries running
    cmds:
      - task: registries:disconnect
      - task: cluster:down

  reset:
    desc: Delete the kind cluster, owned registry containers, and anonymous volumes
    cmds:
      - task: down
      - task: registries:down

  status:
    aliases: [s]
    desc: Show cluster, registry, and Zarf package status
    cmds:
      - task: cluster:status
      - task: registries:status
      - task: base:status

  dev:
    desc: Run core on the cluster with Tilt, hot-reloading the API from src/
    preconditions: &tilt
      - sh: command -v tilt >/dev/null
        msg: tilt is not on PATH
      - sh: test "$(kubectl config current-context)" = {{.KUBE_CONTEXT | shellQuote}}
        msg: Switch kubectl to the selected KUBE_CONTEXT, or run `task env` first
    env: &tilt-env
      KUBE_CONTEXT: "{{.KUBE_CONTEXT}}"
    cmds:
      - tilt up

  dev:ci:
    desc: Build core from this checkout and deploy it once with Tilt, without watching files
    preconditions: *tilt
    env: *tilt-env
    cmds:
      - tilt ci

  dev:down:
    desc: Remove the resources Tilt deployed
    preconditions: *tilt
    env: *tilt-env
    cmds:
      - tilt down

  lint:
    desc: Run all pre-commit hooks
    cmds:
      - uv run --locked prek run --all-files

  test:
    desc: Run the test suite; pass pytest arguments after --
    cmds:
      - uv run --locked pytest {{.CLI_ARGS}}

  version:bump:
    desc: Bump both package versions and refresh the workspace lock
    cmds:
      - uv run --no-sync bump-my-version bump {{.CLI_ARGS | default "patch"}}
      - uv lock
