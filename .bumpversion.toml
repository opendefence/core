[tool.bumpversion]
current_version = "0.4.0+261026"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)\\+(?P<build>\\d+)"
serialize = ["{major}.{minor}.{patch}+{build}"]

[tool.bumpversion.parts.build]
calver_format = "{0Y}{0M}{0D}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'lib-opendefence-core=={current_version}'
replace = 'lib-opendefence-core=={new_version}'

[[tool.bumpversion.files]]
filename = "src/lib_opendefence_core/pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/lib_opendefence_core/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

# Container tags can't contain "+", so images use "-" before the build number
[[tool.bumpversion.files]]
filename = "manifests/api/deployment.yaml"
search = "ghcr.io/opendefence/core:{current_major}.{current_minor}.{current_patch}-{current_build}"
replace = "ghcr.io/opendefence/core:{new_major}.{new_minor}.{new_patch}-{new_build}"

[[tool.bumpversion.files]]
filename = "manifests/operator/operator.yaml"
search = "ghcr.io/opendefence/core:{current_major}.{current_minor}.{current_patch}-{current_build}"
replace = "ghcr.io/opendefence/core:{new_major}.{new_minor}.{new_patch}-{new_build}"

[[tool.bumpversion.files]]
filename = "uv.lock"
search = '''
name = "lib-opendefence-core"
version = "{current_version}"'''
replace = '''
name = "lib-opendefence-core"
version = "{new_version}"'''

[[tool.bumpversion.files]]
filename = "uv.lock"
search = '''
name = "opendefence-core"
version = "{current_version}"'''
replace = '''
name = "opendefence-core"
version = "{new_version}"'''
