[project]
name = "lib-opendefence-core"
version = "0.2.2+261011"
description = "OpenDefence Kubernetes resource models"
authors = [{name = "Niilo Vuokila", email = "niilo@opendefence.fi"}]
license = "MPL-2.0"
license-files = ["LICENSE.txt"]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "cloudcoil>=0.8.0,<1.0",
    "pydantic>=2.12.0,<3.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "models", "py.typed"]

[tool.hatch.build.targets.wheel.sources]
"" = "lib_opendefence_core"

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml", "README.md", "LICENSE.txt", "__init__.py", "models", "py.typed"]
