# This workflow is managed by gh actions-lock.

name: Publish image and Zarf package

on:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: core-publish
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version-tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open(".bumpversion.toml", "rb"))["tool"]["bumpversion"]["current_version"])')"
          echo "tag=${version//+/-}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The package's manifests pin these tags, so they must exist before the package is published.
      # The package itself goes to packages/core, because it shares version tags with the images.
      - name: Build and push the images
        env:
          IMAGE: ghcr.io/opendefence/core:${{ steps.version.outputs.tag }}
          UI_IMAGE: ghcr.io/opendefence/core-ui:${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          docker build --target production -t "$IMAGE" .
          docker run --rm "$IMAGE" --version
          docker push "$IMAGE"
          docker build --target production -t "$UI_IMAGE" ui
          docker push "$UI_IMAGE"
          {
            printf '## Published images\n\n'
            printf -- "- \`%s\`\n" "$IMAGE" "$UI_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    needs: image
    runs-on: arc-runner-set
    defaults:
      run:
        shell: bash
    env:
      VERSION_TAG: ${{ needs.image.outputs.version-tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.1.1
        with:
          cache: true
          install_args: zarf task

      - name: Build package
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d "$RUNNER_TEMP/zarf-build.XXXXXX")"
          task -t taskfiles/build.yaml package ARCH=amd64 BUILD_DIR="$build_dir"
          shopt -s nullglob
          packages=("$build_dir"/zarf-package-*.tar.zst)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected exactly one Zarf package archive" >&2
            exit 1
          fi
          echo "PACKAGE=${packages[0]}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish version and latest
        run: |
          set -euo pipefail
          zarf package publish "$PACKAGE" oci://ghcr.io/opendefence/packages \
            --tag "$VERSION_TAG" --confirm
          zarf package publish "$PACKAGE" oci://ghcr.io/opendefence/packages \
            --tag latest --confirm
          {
            printf '## Published Zarf package\n\n'
            printf -- "- \`%s\`\n" "ghcr.io/opendefence/packages/core:${VERSION_TAG}" "ghcr.io/opendefence/packages/core:latest"
          } >> "$GITHUB_STEP_SUMMARY"
