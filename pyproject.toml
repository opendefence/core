[project]
name = "opendefence_core"
version = "0.1.0+261010"
description = "Runs core operators and REST API for OpenDefence operational platform"
authors = [{name="Niilo Vuokila", email="niilo@opendefence.fi" }]
homepage = "https://github.com/opendefence/core"
repository = "https://github.com/opendefence/core"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = ["click>=8.5.0,<9.0"]

[project.scripts]
opendefence_core = "opendefence_core.cli.console:opendefence_core_cli"


[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["_build", "buck-out"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PL"]
# Pylint's optional magic-value extension was not enabled previously.
ignore = ["PLR2004"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
search-path = ["src"]
python-version = "3.12"

[tool.pytest.ini_options]
junit_family="xunit2"
addopts="--cov=opendefence_core --cov-fail-under=65 --cov-branch"
asyncio_mode="strict"
asyncio_default_fixture_loop_scope="function"

[tool.coverage.run]
# Measure CLI subprocesses with pytest-cov 7 and newer.
patch = ["subprocess"]
omit = ["tests/*"]
branch = true

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0",
    "coverage>=7.16.0,<8.0",
    "pytest-cov>=7.1.0,<8.0",
    "ruff>=0.16.7,<1.0",
    "bandit>=1.9.4,<2.0",
    "pyrefly>=1.3.0,<2.0",
    "prek>=0.5.2,<1.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "bump-my-version>=1.5.1,<2.0",
    "detect-secrets>=1.5.0,<2.0",
]

[build-system]
requires = ["hatchling>=1.32.0,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendefence_core"]
