# Hardens the operator manifests that `task build:manifests` renders from the
# operator code into operator.yaml; Zarf builds this kustomization.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: core-operator-config
    namespace: opendefence-system
    literals:
      - CORE_OPERATOR_USER_CERTIFICATE_DURATION=2880h
resources:
  - certificate.yaml
  - operator.yaml
patches:
  - path: deployment-patch.yaml
  - path: webhook-patch.yaml
