# Serving certificate for the operator's admission webhook. cert-manager
# injects its CA into the ValidatingWebhookConfiguration (inject-ca-from).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: core-operator-tls
  namespace: opendefence-system
spec:
  secretName: core-operator-tls # pragma: allowlist secret
  dnsNames:
    - core-operator.opendefence-system.svc
    - core-operator.opendefence-system.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: internal-root-issuer
    kind: ClusterIssuer
    group: cert-manager.io
