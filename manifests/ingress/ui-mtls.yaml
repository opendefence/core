apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: core-ui-mtls
  namespace: opendefence-system
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`app.{{ .Values.domain }}`)
      middlewares:
        - name: strip-identity-headers
          namespace: traefik-system
        - name: hsts
          namespace: traefik-system
      services:
        - name: core-ui
          port: http
  tls:
    options:
      name: core-mtls
      namespace: cert-manager
