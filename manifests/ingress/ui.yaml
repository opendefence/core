# Traefik prefers the longer rule, so manifests/ingress/api.yaml keeps /api
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: core-ui
  namespace: opendefence-system
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .Values.domain }}`)
      middlewares:
        - name: strip-identity-headers
          namespace: traefik-system
        - name: hsts
          namespace: traefik-system
      services:
        - name: core-ui
          port: http
  tls: {}
