apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: core-api-mtls
  namespace: opendefence-system
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`app.{{ .Values.domain }}`) && PathPrefix(`/api`)
      middlewares:
        - name: strip-identity-headers
          namespace: traefik-system
        - name: pass-client-cert
          namespace: traefik-system
        - name: hsts
          namespace: traefik-system
      services:
        - name: core-api
          port: http
  tls:
    options:
      name: core-mtls
      namespace: traefik-system
