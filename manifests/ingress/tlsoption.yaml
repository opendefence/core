# Traefik reads clientAuth secrets from the TLSOption namespace; base publishes the client CA there
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: core-mtls
  namespace: traefik-system
spec:
  clientAuth:
    secretNames:
      - client-ca
    clientAuthType: RequireAndVerifyClientCert
