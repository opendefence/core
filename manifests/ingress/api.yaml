apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: core-api
  namespace: opendefence-system
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      # Public and enrollment routes only; everything else is on app.<domain>
      match: >-
        Host(`{{ .Values.domain }}`) && (
        Path(`/api/v3/health`) ||
        Path(`/api/v3/enrollment`) ||
        Path(`/api/v3/enrollment/check`) ||
        Path(`/api/v3/certificates/csr`) ||
        Path(`/api/v3/certificates/chain.pem`) ||
        Path(`/api/docs`) ||
        Path(`/api/openapi.json`))
      middlewares:
        - name: strip-identity-headers
          namespace: traefik-system
        - name: hsts
          namespace: traefik-system
      services:
        - name: core-api
          port: http
  tls: {}
