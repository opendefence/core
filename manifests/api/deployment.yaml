apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: opendefence-system
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: opendefence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: core-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-api
        app.kubernetes.io/part-of: opendefence
    spec:
      serviceAccountName: core-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/opendefence/core:0.4.0-261026 # package version with "-" for "+", kept in sync by bump-my-version
          args: [api, run] # after the image entrypoint, tini -- opendefence_core
          envFrom:
            - configMapRef:
                name: core-config # manifests/config.yaml
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: jwt-key
              mountPath: /var/run/secrets/opendefence/jwt
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: jwt-key
          secret:
            secretName: core-api-jwt # pragma: allowlist secret
            items:
              - key: tls.key
                path: tls.key
        - name: tmp
          emptyDir: {}
