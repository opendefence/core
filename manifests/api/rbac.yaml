apiVersion: v1
kind: ServiceAccount
metadata:
  name: core-api
  namespace: opendefence-system
---
# Enrollment redeems Invites into Users: it looks an invite up by code, counts
# the use in its status, creates the User, and reads it back for each token.
# Users store their own CSR on their User
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: core-api
rules:
  - apiGroups: [platform.opendefence.fi]
    resources: [invites]
    verbs: [get, list, create, update, delete]
  - apiGroups: [platform.opendefence.fi]
    resources: [invites/status]
    verbs: [update]
  - apiGroups: [platform.opendefence.fi]
    resources: [users]
    verbs: [get, list, create, update, patch]
  - apiGroups: [platform.opendefence.fi]
    resources: [roles]
    verbs: [list, create, delete]
  - apiGroups: [platform.opendefence.fi]
    resources: [groups]
    verbs: [list, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: core-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: core-api
subjects:
  - kind: ServiceAccount
    name: core-api
    namespace: opendefence-system
---
# Users download their own issued certificate chain
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: core-api
  namespace: opendefence-public-certs
rules:
  - apiGroups: [cert-manager.io]
    resources: [certificaterequests]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: core-api
  namespace: opendefence-public-certs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: core-api
subjects:
  - kind: ServiceAccount
    name: core-api
    namespace: opendefence-system
