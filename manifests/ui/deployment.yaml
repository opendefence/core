apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-ui
  namespace: opendefence-system
  labels:
    app.kubernetes.io/name: core-ui
    app.kubernetes.io/part-of: opendefence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: core-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-ui
        app.kubernetes.io/part-of: opendefence
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: ghcr.io/opendefence/core-ui:0.2.5-261021 # package version with "-" for "+", kept in sync by bump-my-version
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # nginx-unprivileged keeps its pid file and its temporary bodies here
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
