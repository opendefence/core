kind: ZarfPackageConfig
metadata:
  name: core
  description: OpenDefence core operator, REST API, and Traefik middlewares
values:
  files:
    - values/values.yaml
  schema: values/values.schema.json
components:
  - name: traefik-middlewares
    required: true
    manifests:
      - name: traefik-middlewares
        template: true
        files:
          - manifests/traefik-middlewares/hsts.yaml
          - manifests/traefik-middlewares/strip-identity-headers.yaml
  - name: api
    required: true
    manifests:
      - name: api
        files:
          - manifests/api/namespace.yaml
          - manifests/api/deployment.yaml
          - manifests/api/service.yaml
    healthChecks:
      - apiVersion: apps/v1
        kind: Deployment
        name: core-api
        namespace: opendefence-system
  - name: ingress
    required: true
    manifests:
      - name: ingress
        template: true
        files:
          - manifests/ingress/certificate.yaml
          - manifests/ingress/tlsstore.yaml
          - manifests/ingress/api.yaml
    healthChecks:
      - apiVersion: cert-manager.io/v1
        kind: Certificate
        name: core-tls
        namespace: traefik-system
